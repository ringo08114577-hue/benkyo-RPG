anslateX(-50%);font-size:74px;filter:drop-shadow(4px 4px 0 #111a)}.pixelroom .tree{position:absolute;bottom:25px;font-size:35px}.pixelroom .tree.left{left:10%}.pixelroom .tree.right{right:9%}.pixelroom .party{position:absolute;bottom:22px;left:31%;display:flex;gap:9px;font-size:26px;filter:drop-shadow(2px 2px #0b1220)}.pixelroom .pixelcaption{position:absolute;bottom:5px;left:8px;right:8px;font-size:10px;letter-spacing:1px;color:#e1f3ff;text-shadow:1px 2px #06101d}.empty{text-align:center;padding:26px 12px;color:var(--muted)}.footer-note{text-align:center;color:#7185a2;font-size:10px;margin:20px 0 5px}.wide{width:100%}.kpi{font-size:21px;font-weight:900}.itembox{border:1px solid #4b6387;background:#122139;border-radius:8px;padding:10px}.checkrow{display:flex;gap:8px;align-items:center}.checkrow input{width:auto}.smallbtn{padding:5px 8px;font-size:12px}.stagebutton{text-align:left;display:block;width:100%;margin:6px 0}.locked{opacity:.5}.hidden{display:none!important}

/* Classic command-menu battle UI */
.dq-battle{background:#111c31;border:3px solid #8196b7;border-radius:7px;padding:10px;box-shadow:0 0 0 3px #263a58,inset 0 0 0 2px #35496a;font-family:"Courier New",monospace;color:#f5f7ff}
.dq-battle-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:2px 3px 10px;font-size:13px;font-weight:900;letter-spacing:.4px}
.dq-battle-heading .dq-location{color:#c4d8fa}
.dq-turn-badge{background:#293d5e;border:2px solid #91a8d0;padding:4px 8px;white-space:nowrap}
.dq-arena{position:relative;isolation:isolate;overflow:hidden;min-height:205px;border:3px solid #8196b7;background:linear-gradient(#243f64 0%,#3b5f83 58%,#415e48 58%,#253f35 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:17px 10px 13px;text-align:center;box-shadow:inset 0 0 0 3px #162742}
.dq-arena:before{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:24%;height:8px;background:repeating-linear-gradient(90deg,#66845b 0 22px,#506f4d 22px 44px)}
.dq-arena:after{content:"";position:absolute;z-index:-1;inset:0;opacity:.36;background-image:radial-gradient(#cce4ff 1px,transparent 1.5px);background-size:29px 23px}
.dq-enemy-figure{font-family:system-ui,sans-serif;font-size:64px;line-height:1.1;filter:drop-shadow(4px 5px 0 #152139);animation:dqFloat 2.8s ease-in-out infinite}
.dq-enemy-name{margin-top:5px;font-weight:900;font-size:16px;text-shadow:2px 2px #17223b}
.dq-enemy-meta{font-family:system-ui,sans-serif;font-size:11px;color:#e3edff;text-shadow:1px 1px #17223b}
.dq-enemy-hp{width:min(260px,82%);margin-top:7px;text-align:left;font-family:system-ui,sans-serif;font-size:10px;color:#fff}
.dq-enemy-hp .statline{height:7px;border-color:#cad7e9}
.dq-enemy-hp .statline span{background:linear-gradient(90deg,#fc7878,#ffd175)}
.dq-message{margin-top:10px;background:#07101f;border:3px solid #8095b7;box-shadow:inset 0 0 0 2px #1d2e49;padding:11px 12px;min-height:66px;line-height:1.7;font-size:13px}
.dq-message-label{color:#9fc8ff;font-size:10px;font-weight:900;letter-spacing:1px;margin-bottom:2px}
.dq-message .dq-progress{color:#a8f0c9;font-size:11px;margin-top:4px}
.dq-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 7px;font-weight:900;font-size:13px}
.dq-section-title small{font-size:10px;color:#b2c3dc;font-weight:500}
.dq-party-grid{display:grid;grid-template-columns:1fr;gap:8px}
.dq-member{border:2px solid #5d7498;background:linear-gradient(120deg,#243651,#15243c);padding:9px;min-width:0}
.dq-member.planned{border-color:#e8c36c;box-shadow:inset 0 0 0 1px #e8c36c55}
.dq-member.fallen{opacity:.58;border-color:#794d5b}
.dq-member-top{display:flex;align-items:center;gap:9px}
.dq-hero-icon{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;background:#0d192d;border:2px solid #647d9e;font-family:system-ui,sans-serif;font-size:29px;box-shadow:inset 0 0 0 2px #263b58}
.dq-member-ident{min-width:0;flex:1}
.dq-member-name{font-size:14px;font-weight:900}
.dq-lv{float:right;color:#b8cbe4;font-size:10px}
.dq-vitals{display:flex;gap:9px;font-size:11px;color:#e6f0ff;margin-top:3px;flex-wrap:wrap}
.dq-vitals .hp{color:#ffb4b4}.dq-vitals .mp{color:#a8d5ff}
.dq-meter{display:grid;grid-template-columns:23px 1fr;align-items:center;gap:5px;margin-top:5px;font-size:10px}
.dq-meter .statline{height:6px}
.dq-meter .hpbar span{background:linear-gradient(90deg,#e45d68,#ffa86a)}
.dq-meter .mpbar span{background:linear-gradient(90deg,#4d9df2,#9eafff)}
.dq-member-command{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;font-size:11px;color:#b9c9e1}
.dq-command-status{color:#ffdf85;font-weight:900}
.dq-commands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:7px}
.dq-command-btn{padding:9px 4px;border:2px solid #758bab;background:#263b5a;color:#fff;font-family:"Courier New",monospace;font-weight:900;font-size:12px;box-shadow:0 2px #080e1a;white-space:normal}
.dq-command-btn.selected{background:#7d622b;color:#fff5d2;border-color:#ffe18e;box-shadow:inset 0 0 0 1px #463519}
.dq-command-btn:disabled{opacity:.35}
.dq-turn-panel{margin-top:10px;background:#1a2a44;border:2px solid #788eaf;padding:10px}
.dq-turn-panel .actions{margin-top:8px}
.dq-turn-start{background:#765b28!important;border:2px solid #ffdf8c!important;color:#fff4cf!important;font-family:"Courier New",monospace;font-weight:900;min-height:44px}
.dq-reset{font-family:"Courier New",monospace;font-weight:900}
.dq-log{margin-top:10px;background:#070e1a;border:2px solid #536a8e;padding:8px 10px;max-height:150px;overflow:auto;font-size:11px;line-height:1.55}
.dq-log-title{color:#9fc8ff;font-weight:900;margin-bottom:4px}
.dq-log p{margin:3px 0}
.dq-result{margin-top:10px;border:2px solid #9aafcf;background:#1c2d49;padding:12px}
.dq-result h3{margin:0 0 4px;font-size:17px}
@keyframes dqFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(min-width:720px){.dq-battle{padding:15px}.dq-arena{min-height:265px}.dq-enemy-figure{font-size:84px}.dq-party-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dq-member{padding:10px}.dq-member-top{align-items:flex-start}.dq-hero-icon{width:40px;height:40px;flex-basis:40px;font-size:25px}.dq-member-name{font-size:13px}.dq-lv{float:none;display:block;margin-top:2px}.dq-vitals{gap:7px}.dq-commands{grid-template-columns:1fr}.dq-command-btn{padding:8px;font-size:12px}.dq-member-command{display:block}.dq-command-status{display:block;margin-top:3px}.dq-message{font-size:14px;padding:13px 15px}}

</style>

function charName(id){const c=chars().find(x=>x.uid===id||x.id===id);return c?c.name:'不明';}
function rarityClass(r){return r==='SP'?'rank-SP':'rank-'+r}
function mainStats(c){const gear=equippedGear(c);const base={atk:c.base.atk+c.allocated.atk+c.level*2,def:c.base.def+c.allocated.def+Math.floor(c.level*1.2),hp:c.base.hp+c.allocated.hp+c.level*7,mp:c.base.mp+c.allocated.mp+c.level*2};let {atk,def,hp,mp}=base;gear.forEach(g=>{atk+=g.stats.atk||0;def+=g.stats.def||0;hp+=g.stats.hp||0;mp+=g.stats.mp||0;(g.effects||[]).forEach(ef=>{if(base[ef.stat]!==undefined) {const extra=Math.max(1,Math.floor(base[ef.stat]*ef.value/100));if(ef.stat==='atk')atk+=extra;if(ef.stat==='def')def+=extra;if(ef.stat==='hp')hp+=extra;if(ef.stat==='mp')mp+=extra;}})});const title=data.equippedTitle;return {atk:Math.floor(atk*(title==='slayer'?1.01:1)),def:Math.floor(def*(title==='tinkerer'?1.01:1)),hp:Math.floor(hp*(title==='explorer'?1.01:1)),mp};}
function equippedGear(c){return Object.values(c.equipment||{}).map(id=>data.gear.find(g=>g.uid===id)).filter(Boolean)}
function expNeed(c){return 20+c.level*10}
function addExp(amount){let gained=0;for(const id of data.party){const c=chars().find(x=>x.id===id);if(!c||c.level>=80)continue;let mul=Date.now()<data.boosterUntil?1.2:1;let add=Math.floor(amount*mul);c.exp+=add;gained+=add;while(c.level<80&&c.exp>=expNeed(c)){c.exp-=expNeed(c);c.level++;c.points+=3;c.skillPoints+=1;}}return gained}
function getParty(){return data.party.map(id=>chars().find(c=>c.id===id)).filter(Boolean)}

function renderStudy(){if(study)return renderStudyQuestion();const subjects=[...new Set(data.questions.map(q=>q.subject))];const topics=[...new Set(data.questions.map(q=>q.topic))];return `<h1 class="screen-title">📚 学習ホール</h1><p class="subtitle">勉強は無制限！正解率と問題数に応じて報酬を獲得できる。</p><section class="card"><h3>学習セッション</h3><div class="formgrid"><div><label>科目</label><select id="studySubject"><option value="すべて">すべて</option>${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label>分野</label><select id="studyTopic"><option value="すべて">すべて</option>${topics.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div><label>問題数</label><select id="studyCount"><option value="5">5問</option><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option></select></div><div><label>出題形式</label><select id="studyMode"><option value="mix">選択＋入力</option><option value="choice">選択問題中心</option><option value="input">入力問題中心</option></select></div></div><div class="actions"><button class="primary" data-action="studyStart">学習開始</button>${data.boosters.length?'<button data-action="useBooster">EXP＋20%（30分）</button>':''}</div><div class="tiny muted" style="margin-top:8px">登録済み問題：${data.questions.length}問 · 苦手な問題ほど出題されやすい</div></section><section class="card" style="margin-top:10px"><h3>報酬の仕組み</h3><div class="grid three"><div class="itembox"><b>🪙 コイン</b><div class="tiny muted">正解・解答数で増加</div></div><div class="itembox"><b>📘 経験値</b><div class="tiny muted">編成中の3人に入る</div></div><div class="itembox"><b>🎟️ チケット</b><div class="tiny muted">通常報酬＋ランダム報酬</div></div></div></section><section class="card" style="margin-top:10px"><div class="row between"><h3>問題バンク</h3><button data-view="questions">問題を追加・管理</button></div><p class="tiny muted">テキスト貼り付け・CSVでまとめて登録もできるよ。</p></section>`;}
function startStudy(){const subject=el('studySubject')?.value||'すべて',topic=el('studyTopic')?.value||'すべて',count=Number(el('studyCount')?.value||5),mode=el('studyMode')?.value||'mix';let candidates=data.questions.filter(q=>(subject==='すべて'||q.subject===subject)&&(topic==='すべて'||q.topic===topic));if(!candidates.length){notify('この条件の問題がないよ。問題バンクで追加してね。',true);return;}let ids=[];for(let i=0;i<count;i++){const pool=[...candidates].sort((a,b)=>(b.weak||0)-(a.weak||0)+Math.random()*.4-.2);let q=pool[Math.floor(Math.random()*Math.min(pool.length,Math.max(3,Math.ceil(pool.length*.5))))]||candidates[Math.floor(Math.random()*candidates.length)];ids.push(q.id);}study={ids,index:0,checked:false,choice:null,answers:[],rewards:{coins:0,exp:0,tickets:0,materials:0,gearTickets:0,booster:0},mode};view='study';render();}
function renderStudyQuestion(){const q=qData(study.ids[study.index]);if(!q){study=null;return renderStudy();}const progress=study.index/study.ids.length*100;let choices=q.choices&&q.choices.length?q.choices:[];if(study.mode==='input'||(study.mode==='mix'&&Math.random()<.5))choices=[];return `<h1 class="screen-title">📚 学習中</h1><p class="subtitle">第 ${study.index+1} / ${study.ids.length} 問 · 正解で報酬ボーナス</p><div class="statline"><span style="width:${progress}%"></span></div><section class="card" style="margin-top:10px"><div class="row between"><span class="tag">${esc(q.subject)} / ${esc(q.topic)}</span><span class="tag">${['','基礎','標準','応用'][q.difficulty||1]}</span></div><div class="question">${esc(q.q)}</div>${study.checked?`<div class="notice ${study.answers[study.answers.length-1]?.ok?'goodnotice':'baddie'}">${study.answers[study.answers.length-1]?.ok?'正解！':'正解：'+esc((q.answers||[]).join(' / '))}</div>`:choices.length?`<div class="choicegrid">${choices.map((c,i)=>`<button data-action="studyChoice" data-value="${esc(c)}" class="${study.choice===c?'primary':''}">${'ABCD'[i]||i+1}. ${esc(c)}</button>`).join('')}</div><div class="actions"><button class="primary" data-action="studyCheck" ${study.choice===null?'disabled':''}>答え合わせ</button><button data-action="studySkip">スキップ</button></div>`:`<label>答えを入力</label><input id="answerInput" value="${esc(study.choice||'')}" placeholder="日本語・英語・式など"><div class="actions"><button class="primary" data-action="studyCheck">答え合わせ</button><button data-action="studySkip">スキップ</button></div>`}${study.checked?`<div class="actions"><button class="primary" data-action="studyNext">${study.index+1===study.ids.length?'結果を見る':'次の問題へ'}</button></div>`:''}</section>`;}

function renderGacha(){return `<h1 class="screen-title">🎰 召喚の間</h1><p class="subtitle">キャラと装備は別々のガチャ。重複キャラは強化ポイントに変換されるよ。</p><div class="grid two"><section class="card"><div class="emoji">✨</div><h3>キャラクターガチャ</h3><p class="muted tiny">R / SR / SSR / UR。キャラのレア度だけで強さが決まるわけではない。</p><div>🎟️ 所持券：${fmt(data.charTickets)} · 天井進捗：${data.pity.char}/30</div><div class="actions"><button data-action="charPull" data-n="1" ${data.charTickets<1?'disabled':''}>1回引く</button><button class="primary" data-action="charPull" data-n="10" ${data.charTickets<10?'disabled':''}>10回引く</button></div></section><section class="card"><div class="emoji">🗡️</div><h3>装備ガチャ</h3><p class="muted tiny">武器・頭・胴・腕・脚・アクセサリー。固定効果＋ランダム追加効果。</p><div>🎟️ 所持券：${fmt(data.gearTickets)} · 天井進捗：${data.pity.gear}/25</div><div class="actions"><button data-action="gearPull" data-n="1" ${data.gearTickets<1?'disabled':''}>1回引く</button><button class="primary" data-action="gearPull" data-n="10" ${data.gearTickets<10?'disabled':''}>10回引く</button></div></section></div><section class="card" style="margin-top:10px"><h3>重複キャラの扱い</h3><div class="tiny muted">同じキャラが出ても失わない。重複分は特別ポイントに変換し、キャラ個別の基礎能力を少し上げられる。</div></section><section class="card" style="margin-top:10px"><h3>最近入手した仲間</h3>${chars().slice(-6).map(c=>`<div class="listitem"><div class="avatar">${c.emoji}</div><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${c.element}属性 · ${c.species} · ${c.rarity}</div></div><span class="tag ${rarityClass(c.rarity)}">${c.rarity}</span></div>`).join('')}</section>`;}

function gearPull(n){if(data.gearTickets<n){notify('装備ガチャ券が足りないよ。',true);return;}data.gearTickets-=n;let got=[];for(let i=0;i<n;i++){data.pity.gear++;let g=randomGear();if(data.pity.gear>=25&&g.rarity==='R'){g.rarity='SR';data.pity.gear=0;}data.gear.push(g);got.push(g.name+'（'+g.rarity+'）');}save();render();notify('装備入手：'+got.slice(0,4).join('、')+(got.length>4?' ほか'+(got.length-4)+'個':''));}

  ${!b.result?`<div class="dq-turn-panel"><div class="row between wrap"><b>ターン開始の確認</b><span class="tiny muted">${chosen===alive.length?'全員決定！':`あと ${alive.length-chosen}人`}</span></div><div class="actions"><button class="dq-turn-start" data-action="resolveBattleTurn" ${chosen<alive.length?'disabled':''}>▶ ターン開始</button><button class="dq-reset" data-action="resetBattlePlan" ${chosen===0?'disabled':''}>コマンドを選び直す</button></div></div>`:''}

function planBattleAction(charUid,move){const b=battle;if(!b||b.result||b.phase!=='planning')return;const c=getParty().find(x=>x.uid===charUid);if(!c)return;const hp=(b.playerHp||{})[charUid]??mainStats(c).hp;if(hp<=0){notify('戦闘不能のキャラは行動できないよ。',true);return;}if(!['attack','skill','defend'].includes(move))return;if(move==='skill'&&(b.playerMp[charUid]||0)<5){notify('MPが足りないよ。',true);return;}b.plannedActions??={};b.plannedActions[charUid]=move;render();}
function battleSpeed(c){return 10+(c.level||1)*.5+(c.role==='速度'?12:c.role==='魔法'?4:c.role==='支援'?3:0)+Math.random()*8;}
function resolveBattleTurn(){const b=battle;if(!b||b.result||b.phase!=='planning')return;b.playerHp??=Object.fromEntries(getParty().map(c=>[c.uid,mainStats(c).hp]));b.plannedActions??={};const party=getParty(),alive=party.filter(c=>(b.playerHp[c.uid]??mainStats(c).hp)>0);if(alive.some(c=>!b.plannedActions[c.uid])){notify('生きている仲間全員の行動を選んでね。',true);return;}for(const c of alive){if(b.plannedActions[c.uid]==='skill'&&(b.playerMp[c.uid]||0)<5){notify(`${c.name}のMPが足りないので、行動を選び直してね。`,true);return;}}b.phase='resolving';const order=alive.map(c=>({type:'ally',c,move:b.plannedActions[c.uid],speed:battleSpeed(c)}));order.push({type:'enemy',speed:11+b.enemy.level*.55+Math.random()*8});order.sort((a,b)=>b.speed-a.speed);const defending=new Set(alive.filter(c=>b.plannedActions[c.uid]==='defend').map(c=>c.uid));b.logs.push(`── ターン ${b.turn}：行動開始 ──`);for(const act of order){if(b.enemy.hp<=0)break;if(act.type==='ally'){const c=act.c,s=mainStats(c);if((b.playerHp[c.uid]||0)<=0){b.logs.push(`${c.name}は戦闘不能で行動できない。`);continue;}if(act.move==='defend'){b.logs.push(`${c.name}は防御態勢をとった。`);continue;}let damage;if(act.move==='skill'){b.playerMp[c.uid]-=5;damage=Math.max(2,Math.floor(s.atk*1.6)-b.enemy.def+Math.floor(Math.random()*9));if(c.element===enemyWeakness(b.enemy.element))damage=Math.floor(damage*1.1);b.logs.push(`${c.name}の${c.element}属性スキル！`);}else{damage=Math.max(1,s.atk-b.enemy.def+Math.floor(Math.random()*5));b.logs.push(`${c.name}の通常攻撃！`);}b.enemy.hp=Math.max(0,b.enemy.hp-damage);b.logs.push(`→ ${damage}ダメージ（敵HP ${b.enemy.hp}/${b.enemy.maxHp}）`);if(b.enemy.hp<=0){b.logs.push(`${b.enemy.name}を撃破！`);finishBattle(true);return;}}else{const targets=party.filter(c=>(b.playerHp[c.uid]||0)>0);if(!targets.length){finishBattle(false);return;}const target=targets[Math.floor(Math.random()*targets.length)],ts=mainStats(target),roll=Math.random();let moveName='通常攻撃',mult=1;if(roll>=.95){moveName='必殺攻撃';mult=1.8;}else if(roll>=.78){moveName='強攻撃';mult=1.4;}else if(roll>=.58){moveName='属性攻撃';mult=1.2;}let incoming=Math.max(1,Math.floor(b.enemy.atk*mult)-ts.def+Math.floor(Math.random()*5));if(defending.has(target.uid))incoming=Math.max(1,Math.floor(incoming*.45));b.playerHp[target.uid]=Math.max(0,(b.playerHp[target.uid]||0)-incoming);b.logs.push(`${b.enemy.name}の${moveName}！${defending.has(target.uid)?'（防御で軽減）':''}`);b.logs.push(`→ ${target.name}に${incoming}ダメージ（HP ${b.playerHp[target.uid]}/${ts.hp}）`);if(party.every(c=>(b.playerHp[c.uid]||0)<=0)){b.logs.push('パーティーは全員倒れてしまった……');finishBattle(false);return;}}}if(b.enemy.hp<=0){finishBattle(true);return;}b.turn++;b.phase='planning';b.plannedActions={};b.logs.push(`── ターン ${b.turn}：次の行動を選択 ──`);save();render();}function finishBattle(win){const b=battle;if(!b)return;const d=DUNGEONS.find(x=>x.id===b.dungeonId);if(win){const first=!data.cleared[b.dungeonId+'_'+b.stageIndex];data.cleared[b.dungeonId+'_'+b.stageIndex]=true;data.stats.wins++;data.stats.clears++;data.stats.kills++;getParty().forEach(c=>{c.totalWins++;});const rewards=grantDungeonRewards(b.dungeonId,b.stageIndex,first);const exp=addExp(4+b.enemy.level);if(Math.random()<.04){data.premiumSpeedTickets=Math.min(30,data.premiumSpeedTickets+1);rewards.push('高速周回＋券');}b.rewards=rewards.concat('戦闘EXP+'+exp);b.result='win';}else{data.dungeonTickets++;b.result='lose';b.rewards=['敗北：チケット返却','所持品の損失なし'];}checkAchievements(false);save();render();}
function stageStartAgain(){if(!battle)return;const {dungeonId,stageIndex}=battle;battle=null;view='dungeon';render();if(data.dungeonTickets<1){notify('チケットが足りないよ。勉強して集めよう。',true);return;}startDungeon(dungeonId,stageIndex);}

function equipGear(gid,charId){const g=data.gear.find(x=>x.uid===gid),c=chars().find(x=>x.uid===charId);if(!g||!c)return;if(c.equipment[g.slot]){const old=data.gear.find(x=>x.uid===c.equipment[g.slot]);if(old)old.equippedBy=null;}Object.values(c.equipment).forEach(id=>{const old=data.gear.find(x=>x.uid===id);if(old&&old.uid===gid)delete c.equipment[g.slot];});c.equipment[g.slot]=gid;g.equippedBy=c.uid;selectedChar=c.uid;save();render();notify(`${c.name}に${g.name}を装備したよ。`);}
function upgradeGear(gid){const g=data.gear.find(x=>x.uid===gid);if(!g)return;if(g.plus>=99){notify('強化値は+99が上限だよ。',true);return;}const cost=10+g.plus*g.plus*3;if(data.coins<cost){notify(`コインが足りない（必要：${cost}）。`,true);return;}data.coins-=cost;if(g.plus>=30&&data.materials<2){notify('強化素材が足りないよ。',true);data.coins+=cost;return;}if(g.plus>=30)data.materials-=2;if(g.plus>=60&&data.rareMaterials<1){notify('レア素材が足りないよ。',true);data.coins+=cost;if(g.plus>=30)data.materials+=2;return;}if(g.plus>=60)data.rareMaterials--;let chance=Math.max(.05,.95-g.plus*.009);if(g.plus===9||g.plus===19||g.plus===29||g.plus===39||g.plus===49||g.plus===59||g.plus===69||g.plus===79||g.plus===89)chance-=.18;let success=Math.random()<chance;if(success){g.plus++;Object.keys(g.stats).forEach(k=>{if(g.stats[k])g.stats[k]+=1;});notify(`${g.name}を+${g.plus}に強化したよ！`);}else{if(g.plus>=50&&Math.random()<.3){g.plus=Math.max(0,g.plus-1);notify('強化失敗！ 強化値が1下がった…',true);}else notify('強化失敗！ 装備は壊れなかったよ。',true);}data.stats.upgrades++;save();render();}
function renderSkills(){const c=chars().find(x=>x.uid===selectedChar||x.id===selectedChar)||getParty()[0];if(!c)return '<div class="empty">キャラクターがいません。</div>';const trees=[{id:'unique',name:'固有ツリー',emoji:'🌟',nodes:[['power','固有攻撃＋5%',2],['mana','最大MP＋5%',1],['revive','希少スキル：再生（試作版）',4]]},{id:'element',name:`${c.element}属性ツリー`,emoji:'🔥',nodes:[['elemental','属性スキル威力＋5%',2],['resist','属性耐性＋3%',1],['burn','状態異常付与率＋5%',3]]},{id:'shared',name:'共有ツリー',emoji:'🛡️',nodes:[['hp','最大HP＋5%',1],['def','防御＋5%',2],['mp','スキル消費MP軽減',3]]}];return `<h1 class="screen-title">🌳 スキルツリー</h1><p class="subtitle">分岐型ツリーの試作版。獲得ポイントを3種類のツリーで使うよ。</p><section class="card"><div class="charhead"><div class="avatar">${c.emoji}</div><div><h2 style="margin:0">${esc(c.name)}</h2><div class="muted">未使用スキルポイント：<b class="goldtext">${c.skillPoints}</b></div></div></div><div class="grid three" style="margin-top:10px">${trees.map(t=>`<section class="itembox"><h3>${t.emoji} ${t.name}</h3>${t.nodes.map(n=>{const got=(c.skills||[]).includes(n[0]);return `<div class="itembox" style="margin-top:7px"><b>${esc(n[1])}</b><div class="tiny muted">必要ポイント：${n[2]}</div><button class="smallbtn ${got?'':'primary'}" data-action="learnSkill" data-char="${c.uid}" data-skill="${n[0]}" data-cost="${n[2]}" ${got||c.skillPoints<n[2]?'disabled':''}>${got?'習得済み':'習得する'}</button></div>`}).join('')}</section>`).join('')}</div><p class="muted tiny">本実装では各ツリーを15〜25スキル規模に拡大し、ルートごとに分岐・上位スキルを配置する予定。</p><div class="actions"><button data-view="characters">キャラ管理に戻る</button></div></section>`;}

function exportSave(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-realm-save.json';a.click();URL.revokeObjectURL(url);notify('バックアップファイルを書き出したよ。安全な場所に保存してね。');}
function importSave(){el('importFile').click();}
function eventHandler(e){const btn=e.target.closest('[data-view],[data-action]');if(!btn)return;if(btn.dataset.view){if(study){study=null;}if(battle&&btn.dataset.view!=='dungeon'&&!battle.result){notify('戦闘中は戻れないよ。戦闘を終えてから移動してね。',true);return;}if(btn.dataset.view==='dungeon'&&battle){if(battle.result)battle=null;else {notify('戦闘中は移動できないよ。',true);return;}}view=btn.dataset.view;editQuestionId=null;render();return;}const a=btn.dataset.action;switch(a){case'studyStart':startStudy();break;case'useBooster':if(data.boosters&&data.boosters.length){data.boosters.shift();data.boosterUntil=Date.now()+30*60*1000;save();render();notify('勉強EXP＋20%ブースターを30分間有効にしたよ！');}break;case'studyChoice':study.choice=btn.dataset.value;render();break;case'studyCheck':checkStudyAnswer();break;case'studyNext':nextStudy();break;case'studySkip':if(study){let q=qData(study.ids[study.index]);q.weak=(q.weak||0)+1;study.checked=true;study.answers.push({id:q.id,ok:false,given:'スキップ'});study.rewards.coins+=0;render();}break;case'studyEnd':study=null;view='study';render();break;case'selectChar':selectedChar=btn.dataset.id;render();break;case'cycleParty':cycleParty(btn.dataset.id);break;case'allocate':{const c=chars().find(x=>x.uid===btn.dataset.id);if(c&&c.points>0){c.points--;c.allocated[btn.dataset.stat]+=btn.dataset.stat==='hp'?10:btn.dataset.stat==='mp'?4:2;save();render();}break;}case'specialUpgrade':{const c=chars().find(x=>x.uid===btn.dataset.id);if(c&&data.duplicatePoints>=5){data.duplicatePoints-=5;const k=btn.dataset.stat;const n={atk:2,def:2,hp:10,mp:4}[k]||1;c.base[k]+=n;save();render();notify(`${c.name}の基礎${({atk:'攻撃',def:'防御',hp:'HP',mp:'MP'})[k]}を永久強化したよ！`);}break;}case'goSkills':selectedChar=btn.dataset.id;view='skills';render();break;case'charPull':charPull(Number(btn.dataset.n));break;case'gearPull':gearPull(Number(btn.dataset.n));break;case'gearEquip':equipGear(btn.dataset.id,btn.dataset.char);break;case'equipSlot':{const slot=btn.dataset.slot,c=chars().find(x=>x.uid===btn.dataset.char);if(!c)return;const opts=data.gear.filter(g=>g.slot===slot&&!g.equippedBy||g.slot===slot&&g.equippedBy===c.uid);if(!opts.length){notify('この部位の装備がありません。ガチャを引いてね。',true);return;}const g=opts[0];equipGear(g.uid,c.uid);break;}case'unequip':{const c=chars().find(x=>x.uid===btn.dataset.char),slot=btn.dataset.slot;if(c&&c.equipment[slot]){const g=data.gear.find(x=>x.uid===c.equipment[slot]);if(g)g.equippedBy=null;delete c.equipment[slot];save();render();}break;}case'upgrade':upgradeGear(btn.dataset.id);break;case'lockGear':{const g=data.gear.find(x=>x.uid===btn.dataset.id);if(g){g.locked=!g.locked;save();render();}break;}case'sellGear':{const g=data.gear.find(x=>x.uid===btn.dataset.id);if(!g||g.locked||g.equippedBy)return;data.coins+=Math.max(1,Math.floor(10+g.plus*2));data.gear=data.gear.filter(x=>x.uid!==g.uid);save();render();notify('装備を売却したよ（売却額は控えめ）。');break;}case'startDungeon':startDungeon(btn.dataset.dungeon,Number(btn.dataset.stage));break;case'speedRun':speedRun(btn.dataset.dungeon,Number(btn.dataset.stage));break;case'premiumRun':premiumRun(btn.dataset.dungeon,Number(btn.dataset.stage));break;case'planBattle':planBattleAction(btn.dataset.id,btn.dataset.move);break;case'resolveBattleTurn':resolveBattleTurn();break;case'resetBattlePlan':if(battle&&!battle.result&&battle.phase==='planning'){battle.plannedActions={};render();}break;case'battleExit':if(battle?.result){battle=null;view='dungeon';render();}break;case'battleAgain':stageStartAgain();break;case'learnSkill':{const c=chars().find(x=>x.uid===btn.dataset.char),id=btn.dataset.skill,cost=Number(btn.dataset.cost);if(c&&c.skillPoints>=cost&&!c.skills.includes(id)){c.skillPoints-=cost;c.skills.push(id);save();render();}break;}case'editQuestion':editQuestionId=btn.dataset.id;view='questions';render();break;case'deleteQuestion':if(confirm('この問題を削除する？')){data.questions=data.questions.filter(q=>q.id!==btn.dataset.id);save();render();}break;case'cancelEdit':editQuestionId=null;render();break;case'bulkAdd':bulkAddText();break;case'csvImport':el('csvFile').click();break;case'equipTitle':data.equippedTitle=btn.dataset.id;save();render();break;case'export':exportSave();break;case'import':importSave();break;case'closeResult':{const p=el('popupresult');if(p)p.remove();break;}case'resetConfirm':if(confirm('本当にセーブデータを削除する？ 先にバックアップをおすすめするよ。')){localStorage.removeItem(SAVE_KEY);data=fresh();battle=null;study=null;selectedChar=null;save();view='home';render();}break;}}
document.body.addEventListener('click',eventHandler);
el('main').addEventListener('submit',e=>{if(e.target.id!=='questionForm')return;e.preventDefault();const f=new FormData(e.target);const obj={subject:String(f.get('subject')).trim(),topic:String(f.get('topic')).trim(),difficulty:Number(f.get('difficulty')),q:String(f.get('q')).trim(),answers:String(f.get('answers')).split('|').map(x=>x.trim()).filter(Boolean),choices:String(f.get('choices')).split('|').map(x=>x.trim()).filter(Boolean)};if(!obj.answers.length||!obj.q)return;if(editQuestionId){const q=qData(editQuestionId);if(q)Object.assign(q,obj);editQuestionId=null;}else addQuestion(obj);save();render();notify('問題を保存したよ。');});
el('main').addEventListener('input',e=>{if(e.target.id==='questionSearch'){const list=el('questionList');if(list)list.innerHTML=renderQuestionList(e.target.value);}});
el('main').addEventListener('change',e=>{if(e.target.id==='gearChar'){selectedChar=e.target.value;render();}if(e.target.id==='studySubject'){const selected=e.target.value,topicSelect=el('studyTopic');if(topicSelect){const topics=[...new Set(data.questions.filter(q=>selected==='すべて'||q.subject===selected).map(q=>q.topic))];topicSelect.innerHTML='<option value="すべて">すべて</option>'+topics.map(t=>`<option>${esc(t)}</option>`).join('');}}});
el('main').addEventListener('keydown',e=>{if(e.target.id==='answerInput'&&e.key==='Enter'&&study&&!study.checked){e.preventDefault();checkStudyAnswer();}});
function bulkAddText(){const ta=el('bulkQuestions'),lines=(ta?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;for(const line of lines){const cols=parseCsvLine(line);if(cols.length<4)continue;const [subject,topic,q,answers,choices='',difficulty='1']=cols;addQuestion({subject:subject.trim()||'その他',topic:topic.trim()||'一般',q:q.trim(),answers:answers.split('|').map(x=>x.trim()).filter(Boolean),choices:choices.split('|').map(x=>x.trim()).filter(Boolean),difficulty:Math.min(3,Math.max(1,Number(difficulty)||1))});n++;}save();render();notify(`${n} 問を追加したよ。`);}
el('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.characters)||!Array.isArray(obj.questions))throw new Error('invalid');if(!confirm('現在のデータを読み込んだデータで置き換える？'))return;data={...fresh(),...obj};save();battle=null;study=null;view='home';render();notify('バックアップを読み込んだよ。');}catch(err){notify('ファイルを読み込めなかったよ。Study Realm のJSONバックアップか確認してね。',true);}finally{e.target.value='';}});
el('csvFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const text=await file.text();let n=0;for(const line of text.split(/\r?\n/).filter(x=>x.trim())){const cols=parseCsvLine(line);if(cols.length<4||/^(科目|subject)$/i.test(cols[0]))continue;const [subject,topic,q,answers,choices='',difficulty='1']=cols;addQuestion({subject:subject.trim()||'その他',topic:topic.trim()||'一般',q:q.trim(),answers:answers.split('|').map(x=>x.trim()).filter(Boolean),choices:choices.split('|').map(x=>x.trim()).filter(Boolean),difficulty:Math.min(3,Math.max(1,Number(difficulty)||1))});n++;}save();render();notify(`CSVから ${n} 問を読み込んだよ。`);}catch(err){notify('CSVを読み込めなかったよ。列順を確認してね。',true);}finally{e.target.value='';}});
function applyDefaults(){if(!data.characters||!data.characters.length)data.characters=[newCharacter('c01'),newCharacter('c02'),newCharacter('c03')];if(!data.party||data.party.length===0)data.party=data.characters.slice(0,3).map(c=>c.id);data.party=data.party.filter(id=>data.characters.some(c=>c.id===id)).slice(0,3);while(data.party.length<3){const c=data.characters.find(x=>!data.party.includes(x.id));if(!c)break;data.party.push(c.id);}data.characters.forEach(c=>{c.allocated??={atk:0,def:0,hp:0,mp:0};c.skills??=[];c.equipment??={};c.points??=0;c.skillPoints??=0;});data.gear??=[];data.boosters??=[];data.duplicatePoints??=0;data.pity??={char:0,gear:0};data.stats??={answered:0,correct:0,wrong:0,wins:0,clears:0,kills:0,upgrades:0,streak:0,bestStreak:0};}
applyDefaults();save();render();
})();
</script>
